spring.application.name=ssms-predictive-module
server.port=${PORT:9091}

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ssms_predictive?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# AI Configuration
# ===============================
predictive.ai.api-url=${PREDICTIVE_AI_API_URL:https://api.openai.com/v1/chat/completions}
predictive.ai.api-key=${PREDICTIVE_AI_API_KEY:your_api_key_here}
predictive.ai.model=${PREDICTIVE_AI_MODEL:gpt-4o}
predictive.ai.max-tokens=${PREDICTIVE_AI_MAX_TOKENS:4096}
predictive.ai.temperature=${PREDICTIVE_AI_TEMPERATURE:0.0}

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

