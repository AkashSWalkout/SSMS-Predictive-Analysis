spring.application.name=ssms-predictive-module
server.port=9091

predictive.ai.api-url=${PREDICTIVE_AI_API_URL:https://api.openai.com/v1/chat/completions}
predictive.ai.api-key=${PREDICTIVE_AI_API_KEY:YOUR_OPENAI_API_KEY}
predictive.ai.model=${PREDICTIVE_AI_MODEL:gpt-4o}
predictive.ai.max-tokens=${PREDICTIVE_AI_MAX_TOKENS:4096}
predictive.ai.temperature=${PREDICTIVE_AI_TEMPERATURE:0.2}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
